name: CI

on:
  pull_request:
  push:
    branches: [main, feat/nabalens-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: Common checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CI_PHASE: common
      CI_VERIFICATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CI_LOG_DIR: ${{ runner.temp }}/common-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Record runner CPU allocation
        run: |
          node -e 'const os = require("node:os"); console.log(JSON.stringify({platform: process.platform, arch: process.arch, logicalCpus: os.cpus().length, availableParallelism: os.availableParallelism(), cpuModel: os.cpus()[0]?.model, memoryMiB: Math.round(os.totalmem()/1048576)}))'
      - name: Run browser-independent checks once
        env:
          CI_COMMON_RECEIPT: ${{ runner.temp }}/common-receipt.json
        run: bash scripts/ci/local-ci.sh
      - name: Publish exact-source common receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: common-checks
          path: ${{ runner.temp }}/common-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Scrub common unit diagnostics
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, writeFileSync } from "node:fs"
          import { scrub } from "./scripts/ci/suite-report.mjs"
          const path = `${process.env.CI_LOG_DIR}/unit.log`
          if (existsSync(path))
            writeFileSync(path.replace(/\.log$/, ".scrubbed.log"), scrub(readFileSync(path, "utf8")))
          JS
      - name: Retain per-test costs and common timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: common-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/common-logs/unit.scrubbed.log
            ${{ runner.temp }}/common-logs/timings.tsv
          retention-days: 7
          if-no-files-found: ignore

  database:
    name: Database checks
    needs: common
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CI_PHASE: database
      CI_VERIFICATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.117.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: common-checks
          path: ${{ runner.temp }}/common
      - name: Install fixture media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run integration, lifecycle and security once
        env:
          CI_COMMON_RECEIPT: ${{ runner.temp }}/common/common-receipt.json
          CI_DATABASE_RECEIPT: ${{ runner.temp }}/database-receipt.json
          CI_LOG_DIR: ${{ runner.temp }}/ci-logs
        run: bash scripts/ci/local-ci.sh
      - name: Publish database and cleanup receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: database-checks
          path: ${{ runner.temp }}/database-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload scrubbed failures and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: database-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-logs/*.scrubbed.log
            ${{ runner.temp }}/ci-logs/timings.tsv
            ${{ runner.temp }}/ci-logs/suite-results.json
          retention-days: 7
          if-no-files-found: ignore

  fixtures:
    name: Fixtures (${{ matrix.lane }})
    needs: [common, database]
    runs-on: ubuntu-24.04
    # This budget includes runner setup, database suites and browser tests.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: chromium-1
            browser: chromium
            shard: 1/2
          - lane: chromium-2
            browser: chromium
            shard: 2/2
          - lane: firefox
            browser: firefox
            shard: ""
          - lane: webkit
            browser: webkit
            shard: ""
    env:
      CI: "true"
      CI_PHASE: browser
      CI_VERIFICATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CI_BROWSER: ${{ matrix.browser }}
      CI_PLAYWRIGHT_SHARD: ${{ matrix.shard }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.117.0
      - name: Fetch this run's common receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: common-checks
          path: ${{ runner.temp }}/common
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch this run's database receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: database-checks
          path: ${{ runner.temp }}/database
      - name: Install browser and Linux dependencies
        run: pnpm exec playwright install --with-deps "$CI_BROWSER"
      - name: Install fixture media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run shared local and hosted gate
        env:
          CI_COMMON_RECEIPT: ${{ runner.temp }}/common/common-receipt.json
          CI_DATABASE_RECEIPT: ${{ runner.temp }}/database/database-receipt.json
          CI_LOG_DIR: ${{ runner.temp }}/ci-logs
        run: |
          if [[ "$CI_BROWSER" == webkit ]]; then
            # Give streamed React pages a normal frame clock in Linux WebKit.
            xvfb-run -a env CI_WEBKIT_HEADED=1 bash scripts/ci/local-ci.sh
          else
            bash scripts/ci/local-ci.sh
          fi
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      # Artifacts of this public repository are public: scrubbed suite logs only.
      - name: Upload scrubbed suite logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-logs-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-logs/*.scrubbed.log
            ${{ runner.temp }}/ci-logs/timings.tsv
            ${{ runner.temp }}/ci-logs/suite-results.json
          retention-days: 7
          if-no-files-found: ignore

  result:
    name: CI result
    if: always()
    needs: [common, database, fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser lane
        env:
          COMMON: ${{ needs.common.result }}
          DATABASE: ${{ needs.database.result }}
          RESULT: ${{ needs.fixtures.result }}
        run: test "$COMMON" = success && test "$DATABASE" = success && test "$RESULT" = success
