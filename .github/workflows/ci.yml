name: CI

on:
  pull_request:
  push:
    branches: [main, feat/nabalens-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Fixtures (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: "true"
      CI_BROWSER: ${{ matrix.browser }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.117.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser and Linux dependencies
        run: pnpm exec playwright install --with-deps "$CI_BROWSER"
      - name: Run shared local and hosted gate
        run: bash scripts/ci/local-ci.sh
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  result:
    name: CI result
    if: always()
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser lane
        env:
          RESULT: ${{ needs.fixtures.result }}
        run: test "$RESULT" = success
