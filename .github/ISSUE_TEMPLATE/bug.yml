name: Bug report
description: Report behavior that differs from what the app or tooling promises.
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Use fixture data only. Do not attach staff details, private media, or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the commit, relevant browser or tool, and a minimal local reproduction.
    validations:
      required: true
