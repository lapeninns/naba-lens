<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>JobCard — preview</title></head>
<body>
<div class="nl-stage nl-stage--stack">
<article class="nl-job">
<div class="nl-thumb"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div>
<div><h3 class="nl-job__title">Chicken momo</h3><p class="nl-job__brief">Show the whole plate from above, on the pass.</p></div>
<div class="nl-job__foot"><span class="nl-chip"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3.3"/></svg> Photo needed</span><button class="nl-btn nl-btn--primary"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg> Add photo</button></div>
</article>
<article class="nl-job">
<div class="nl-thumb"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>
<div><h3 class="nl-job__title">Garden</h3><p class="nl-job__brief">One wide view from the back door, tables set.</p></div>
<div class="nl-job__foot"><span class="nl-chip nl-chip--progress"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Awaiting review</span><button class="nl-btn">Add another</button></div>
</article>
</div>
</body>
</html>
