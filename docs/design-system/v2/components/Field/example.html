<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>Field — preview</title></head>
<body>
<div class="nl-stage nl-stage--stack" style="gap:var(--space-4)">
<div class="nl-field"><label class="nl-field__label" for="f1">Find a dish, drink or space</label><div class="nl-search"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="nl-input" id="f1" type="search" value="momo"></div></div>
<div class="nl-field"><label class="nl-field__label" for="f2">Note for your manager (optional)</label><textarea class="nl-input" id="f2" aria-describedby="f2h">New plate from this week.</textarea><p class="nl-field__hint" id="f2h">You can leave this empty.</p></div>
<div class="nl-field nl-field--error"><label class="nl-field__label" for="f3">Email address</label><input class="nl-input" id="f3" type="email" value="sam@lapeninns" aria-invalid="true" aria-describedby="f3e"><p class="nl-field__error" id="f3e"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> Enter the full address, like name@example.com</p></div>
<label class="nl-check"><input type="checkbox" checked> These 4 photos are all the same item</label>
</div>
</body>
</html>
