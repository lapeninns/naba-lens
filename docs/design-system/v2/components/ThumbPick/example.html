<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>ThumbPick — preview</title></head>
<body>
<div style="padding:var(--space-4);max-width:440px">
<div class="nl-thumbgrid" role="group" aria-label="Choose photos to label, 2 of 4 selected">
<button class="nl-thumbpick" aria-pressed="true" aria-label="Photo 1, selected"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg><span class="nl-thumbpick__mark"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
<button class="nl-thumbpick" aria-pressed="true" aria-label="Photo 2, selected"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg><span class="nl-thumbpick__mark"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
<button class="nl-thumbpick" aria-pressed="false" aria-label="Photo 3, labelled Garden"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg><span class="nl-thumbpick__mark"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="nl-thumbpick__label">Garden</span></button>
<button class="nl-thumbpick" aria-pressed="false" aria-label="Photo 4, no label yet"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg><span class="nl-thumbpick__mark"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
</div>
<p style="margin:var(--space-3) 0 0;font:500 13px/18px var(--font-sans);color:var(--ink-muted)">2 selected · 1 without a label</p>
</div>
</body>
</html>
