<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>CoverageMeter — preview</title></head>
<body>
<div class="nl-stage nl-stage--stack">
<section class="nl-cover" aria-label="Food coverage">
<div class="nl-cover__head"><h3 class="nl-cover__label">Food</h3><p class="nl-cover__figure">30/40<small>75% covered</small></p></div>
<div class="nl-cover__bar" role="img" aria-label="30 covered, 5 awaiting review, 2 need replacing, 3 missing"><span class="nl-cover__seg--covered" style="width:75%"></span><span class="nl-cover__seg--pending" style="width:12.5%"></span><span class="nl-cover__seg--replace" style="width:5%"></span></div>
<ul class="nl-cover__legend">
<li><span class="nl-chip nl-chip--positive"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> 30 covered</span></li>
<li><span class="nl-chip nl-chip--progress"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> 5 awaiting review</span></li>
<li><span class="nl-chip nl-chip--problem"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> 2 need replacing</span></li>
<li><span class="nl-chip"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3.3"/></svg> 3 missing</span></li>
</ul>
</section>
</div>
</body>
</html>
