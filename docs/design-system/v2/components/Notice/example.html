<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>Notice — preview</title></head>
<body>
<div class="nl-stage nl-stage--stack">
<div class="nl-notice nl-notice--attention" role="status"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg><div class="nl-notice__body"><p class="nl-notice__title">2 photos didn’t upload</p><p class="nl-notice__text">Your other 3 are safe. Retry when you have a signal.</p></div><button class="nl-btn nl-btn--compact">Retry</button></div>
<div class="nl-notice nl-notice--progress" role="status"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div class="nl-notice__body"><p class="nl-notice__title">Saved on this device</p><p class="nl-notice__text">We’ll send these when you’re back online. Keep this page open.</p></div></div>
<div class="nl-notice nl-notice--problem" role="alert"><svg class="nl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div class="nl-notice__body"><p class="nl-notice__title">This file is too big</p><p class="nl-notice__text">Videos can be up to 60 seconds. Trim it and add it again.</p></div></div>
</div>
</body>
</html>
